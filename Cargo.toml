[package]
name = "woccs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "woccs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
wgpu = "30.0.1"
winit = { version = "0.30.13", features = ["x11"] }
naga = { version = "30.0.1", features = ["wgsl-out", "wgsl-in"] }
env_logger = "0.11.11"
pollster = { version = "1.0.1", features = ["macro"] }
